<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 588" role="img" aria-labelledby="t">
<title id="t">Agent Hub architecture: a kernel in the middle, everything else a plugin</title>
<defs>
<style>
svg{--bg:#faf9f5;--ink:#1d1c19;--muted:#6e6b64;--line:#d6d3cb;--card:#fff;--item:#f4f2ec;--accent:#c2491d;--core:#1d1c19;--core-ink:#faf9f5;--core-chip:#2f2d28;--core-sub:#b9b5ab;--core-accent:#ef8a62}
@media (prefers-color-scheme:dark){svg{--bg:#151412;--ink:#f1efe9;--muted:#a29e95;--line:#45433d;--card:#1e1d1a;--item:#262420;--accent:#ef8a62;--core:#f1efe9;--core-ink:#1d1c19;--core-chip:#dfdcd3;--core-sub:#5f5c55;--core-accent:#c2491d}}
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:14px;fill:var(--ink)}
.h2{font-size:17px;font-weight:600}
.s{font-size:12.5px;fill:var(--muted)}
.r{font-size:13.5px}
.l{font-size:14px;font-weight:600;fill:var(--accent)}
.bg{fill:var(--bg)}
.plug{fill:var(--card);stroke:var(--muted);stroke-width:1.3;stroke-dasharray:6 5}
.item{fill:var(--item);stroke:var(--line)}
.more{fill:none;stroke:var(--line);stroke-dasharray:4 4}
.dot{fill:var(--muted)}
.core{fill:var(--core)}
.chip{fill:var(--core-chip)}
.ct{font-size:32px;font-weight:700;fill:var(--core-ink)}
.cs{font-size:12.5px;fill:var(--core-sub)}
.cn{font-size:15px;font-weight:600;fill:var(--core-ink)}
.cd{font-size:12px;fill:var(--core-sub)}
.cl{font-size:13px;fill:var(--core-ink)}
.you{fill:var(--card);stroke:var(--ink);stroke-width:1.4}
.badge{fill:var(--accent)}
.badge-in{fill:var(--core-accent)}
.n,.n-in{font-size:13px;font-weight:700;fill:var(--bg)}
.conn{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#a)}
.back{fill:none;stroke:var(--core-accent);stroke-width:1.6;stroke-dasharray:5 4;marker-end:url(#c)}
.flow{fill:none;stroke:var(--muted);stroke-width:1.3;marker-end:url(#b)}
.both{fill:none;stroke:var(--muted);stroke-width:1.3;marker-start:url(#b);marker-end:url(#b)}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--accent)"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--core-accent)"/></marker>
</defs>
