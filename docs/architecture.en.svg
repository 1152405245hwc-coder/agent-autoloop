<text x="488.0" y="403.0" class="cd" text-anchor="middle">waiting is free</text>
<rect class="chip" x="580" y="358" width="160" height="58" rx="8"/>
<text x="660.0" y="384.0" class="cn" text-anchor="middle">Log</text>
